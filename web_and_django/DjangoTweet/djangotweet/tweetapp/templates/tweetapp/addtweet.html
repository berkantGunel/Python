{% extends "base.html" %}

{% block content %}

<div class="container d-flex justify-content-center py-5">
    <form action="" method="POST" class="w-100" style="max-width: 500px;">
        {% csrf_token %}
        
        <!-- Nickname Field -->
        {% comment %} <div class="mb-4">
            <label for="nickname" class="form-label fs-4 fw-bold">Nick Name</label>
            <input type="text" class="form-control" id="nickname" name="nickname" placeholder="Enter your Nickname" required maxlength="30">
        </div> {% endcomment %}
        
        <!-- Message Field -->
        <div class="mb-4">
            <label for="message" class="form-label fs-4 fw-bold">Message</label>
            <textarea class="form-control" id="message" name="message" placeholder="Type your message" required maxlength="100" rows="4"></textarea>
        </div>
        
        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary w-100 py-2 fs-5">Send Tweet</button>
    </form>
</div>

{% endblock content %}
