{% extends "base.html" %}
{% load static %}

{% block content %}
<h1>Add Tweet By Form</h1>
<div class="container tweetform">
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-control">
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Send Tweet</button>
    </form>
</div>
{% endblock content %}
